<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"></helmet>
<div style="position:relative;width:100%;height:100%;background:#000;border-radius:inherit;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff">
<sc-if value="{{ a.frame }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:50%;top:6%;height:{{ a.frameH }};aspect-ratio:9/16;transform:translateX(-50%) {{ a.jit }};border-radius:4px;overflow:hidden;background:{{ a.frameBg }}">
<sc-if value="{{ a.person }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56%;height:62%;display:flex;flex-direction:column;align-items:center"><div style="width:42%;aspect-ratio:1;border-radius:999px;background:#C9A27A"></div><div style="flex:1;width:100%;margin-top:4%;border-radius:40% 40% 0 0;background:#2E86AB"></div></div></sc-if>
<sc-if value="{{ a.title }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:14%;left:0;right:0;text-align:center;font-family:'Bangers',Impact,sans-serif;font-size:{{ a.titleFs }};color:#F4F4F5;-webkit-text-stroke:1px #000;opacity:{{ a.titleOp }}">LISBON</div></sc-if>
<sc-if value="{{ a.caption }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;bottom:10%;left:6%;right:6%;background:rgba(0,0,0,.65);border-radius:3px;padding:2px 3px;font-size:{{ a.capFs }};font-weight:700;text-align:center;line-height:1.2">{{ a.w1 }} <span style="color:#F5C542">{{ a.w2 }}</span> {{ a.w3 }}</div></sc-if>
<sc-if value="{{ a.brackets }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:8%;border:0 solid transparent"><div style="position:absolute;left:0;top:0;width:22%;height:14%;border-left:2px solid #D9B36A;border-top:2px solid #D9B36A"></div><div style="position:absolute;right:0;top:0;width:22%;height:14%;border-right:2px solid #D9B36A;border-top:2px solid #D9B36A"></div><div style="position:absolute;left:0;bottom:0;width:22%;height:14%;border-left:2px solid #D9B36A;border-bottom:2px solid #D9B36A"></div><div style="position:absolute;right:0;bottom:0;width:22%;height:14%;border-right:2px solid #D9B36A;border-bottom:2px solid #D9B36A"></div></div></sc-if>
<sc-if value="{{ a.ghost }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;border:1.5px dashed rgba(255,255,255,.5);transform:translate(5%,-3%) rotate(2deg)"></div></sc-if>
</div></sc-if>
<sc-if value="{{ a.tl }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:5%;right:5%;bottom:6%;height:{{ a.tlH }};background:#0E0E0F;border-radius:6px;overflow:hidden">
<sc-for list="{{ a.clips }}" as="c" hint-placeholder-count="3"><div style="position:absolute;top:10%;height:44%;left:{{ c.x }};width:{{ c.w }};border-radius:3px;background:{{ c.bg }};box-shadow:{{ c.ring }}"></div></sc-for>
<sc-for list="{{ a.ticks }}" as="k" hint-placeholder-count="5"><div style="position:absolute;top:4%;height:58%;left:{{ k }};width:1.5px;background:{{ a.tickC }}"></div></sc-for>
<sc-if value="{{ a.music }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:62%;height:26%;left:3%;width:{{ a.musicW }};border-radius:3px;background:#47C5D2"></div></sc-if>
<sc-if value="{{ a.play }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:0;bottom:0;left:{{ a.play }};width:2px;background:#fff"></div></sc-if>
</div></sc-if>
<sc-if value="{{ a.rows }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:10% 8%;display:flex;flex-direction:column;gap:6%"><sc-for list="{{ a.rows }}" as="r" hint-placeholder-count="4"><div style="flex:1;border-radius:6px;background:#1C1C1E;display:flex;align-items:center;gap:6%;padding:0 6%;opacity:{{ r.op }};transform:translateY({{ r.y }})"><span style="font-family:'Material Symbols Rounded';font-size:{{ a.ic }}">{{ r.g }}</span><div style="flex:1;height:22%;border-radius:2px;background:rgba(235,235,245,.35)"></div><div style="height:58%;aspect-ratio:2.2;border-radius:999px;background:{{ r.bg }};box-shadow:{{ r.ring }}"></div></div></sc-for></div></sc-if>
<sc-if value="{{ a.thumb }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:50%;bottom:8%;height:58%;aspect-ratio:9/16;transform:translateX(-50%);border-radius:4px;background:repeating-linear-gradient(160deg,#4A4A4C 0 8px,#444446 8px 16px)"></div>
<sc-for list="{{ a.marks }}" as="m" hint-placeholder-count="5"><div style="position:absolute;left:{{ m.x }};top:{{ m.y }};width:14%;aspect-ratio:1;border-radius:22%;background:#1C1C1E;box-shadow:0 0 0 1px rgba(235,235,245,.3);display:flex;align-items:center;justify-content:center;font:600 {{ a.markFs }} ui-monospace,Menlo,monospace;color:rgba(235,235,245,.7);opacity:{{ m.op }}">{{ m.t }}</div></sc-for></sc-if>
<sc-if value="{{ a.spin }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:calc(50% - 9px);top:calc(50% - 9px);width:18px;height:18px;border-radius:999px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff"></div></sc-if>
<sc-if value="{{ a.tick }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38%;aspect-ratio:1;border-radius:999px;background:#D9B36A;display:flex;align-items:center;justify-content:center"><span style="font-family:'Material Symbols Rounded';font-size:{{ a.tickFs }};color:#000;font-weight:700">check</span></div></sc-if>
<sc-if value="{{ a.grid }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:6%;display:grid;grid-template-columns:1fr 1fr;gap:6%"><sc-for list="{{ a.grid }}" as="g" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;gap:3px;min-height:0"><div style="flex:1;border-radius:4px;background:{{ g.bg }};box-shadow:{{ g.ring }}"></div><div style="font-size:{{ a.gFs }};font-weight:600;text-align:center;line-height:1.1">{{ g.l }}</div></div></sc-for></div></sc-if>
<sc-if value="{{ a.status }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:6%;top:6%;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.75);font-size:{{ a.capFs }};font-weight:600;color:{{ a.statusC }}">{{ a.status }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:180},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;p1-empty&quot;,&quot;p1-clips&quot;,&quot;p1-sweep&quot;,&quot;p1-title&quot;,&quot;p1-final&quot;,&quot;beats-a&quot;,&quot;beats&quot;,&quot;cutout-a&quot;,&quot;cutout&quot;,&quot;captions-a&quot;,&quot;captions&quot;,&quot;stab-a&quot;,&quot;stabilize&quot;,&quot;summary&quot;,&quot;p3-rows-a&quot;,&quot;p3-rows&quot;,&quot;p3-changed&quot;,&quot;p4-thumb&quot;,&quot;p4-arc&quot;,&quot;p4-busy&quot;,&quot;p4-done&quot;],&quot;default&quot;:&quot;p1-final&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.scene ?? 'p1-final', small = !!this.props.small;
    const a = { frame: true, frameH: '56%', frameBg: 'repeating-linear-gradient(160deg,#4A4A4C 0 10px,#444446 10px 20px)', jit: '', person: false, title: false, titleFs: small ? '12px' : '22px', titleOp: 1, caption: false, capFs: small ? '6px' : '10px', w1: '', w2: '', w3: '', brackets: false, ghost: false, tl: true, tlH: '30%', clips: [], ticks: [], tickC: 'rgba(255,255,255,.7)', music: false, musicW: '80%', play: '', rows: null, ic: small ? '10px' : '18px', thumb: false, marks: [], markFs: small ? '5px' : '9px', spin: false, tick: false, tickFs: small ? '18px' : '40px', grid: null, gFs: small ? '7px' : '12px', status: '', statusC: '#fff' };
    const C = (x, w, bg = '#5A5A5E', ring = 'none') => ({ x: x + '%', w: w + '%', bg, ring });
    const three = [C(3, 28), C(33, 34, '#4A4A4C'), C(69, 28, '#545458')];
    const P = { 'p1-empty': { clips: [] }, 'p1-clips': { clips: three }, 'p1-sweep': { clips: three, play: '45%' }, 'p1-title': { clips: three, play: '60%', title: true, titleOp: 0.7 }, 'p1-final': { clips: three, play: '78%', title: true, music: true },
      'beats-a': { clips: [C(3, 33), C(38, 30, '#4A4A4C'), C(70, 26, '#545458')], ticks: ['20%', '35%', '50%', '65%', '80%'] },
      'beats': { clips: [C(3, 32, '#5A5A5E', '0 0 0 1.5px #D9B36A'), C(36, 29, '#4A4A4C'), C(66, 30, '#545458')], ticks: ['20%', '35%', '50%', '65%', '80%'], tickC: '#D9B36A', music: true, status: 'Cut to the beat' },
      'cutout-a': { person: true, status: 'Preparing 37%' },
      'cutout': { person: true, frameBg: 'repeating-conic-gradient(#2C2C2E 0 25%,#1C1C1E 0 50%) 0 0/12px 12px', status: 'Ready.', statusC: '#34C759' },
      'captions-a': { caption: true, w1: 'so', w2: 'we', w3: '' },
      'captions': { caption: true, w1: 'so we', w2: 'walked', w3: 'up the hill' },
      'stab-a': { ghost: true, jit: 'rotate(-2deg)' },
      'stabilize': { brackets: true, frameH: '60%', status: 'Steady' },
      'summary': { frame: false, tl: false, grid: [
        { l: 'Cut to beats', bg: 'linear-gradient(90deg,transparent 31%,#D9B36A 31% 33%,transparent 33% 64%,#D9B36A 64% 66%,transparent 66%),repeating-linear-gradient(90deg,#5A5A5E 0 31%,#0E0E0F 31% 33%)', ring: 'none' },
        { l: 'Remove background', bg: 'radial-gradient(circle at 50% 38%,#C9A27A 0 13%,transparent 14%),linear-gradient(transparent 56%,#2E86AB 56%) 50% 0/46% 100% no-repeat,repeating-conic-gradient(#2C2C2E 0 25%,#1C1C1E 0 50%) 0 0/8px 8px', ring: 'none' },
        { l: 'Captions', bg: 'linear-gradient(transparent 68%,rgba(0,0,0,.75) 68% 84%,transparent 84%),linear-gradient(90deg,transparent 20%,#fff 20% 40%,#F5C542 40% 58%,#fff 58% 80%,transparent 80%) 0 75%/100% 4% no-repeat,repeating-linear-gradient(160deg,#4A4A4C 0 8px,#444446 8px 16px)', ring: 'none' },
        { l: 'Stabilize', bg: 'repeating-linear-gradient(160deg,#4A4A4C 0 8px,#444446 8px 16px)', ring: 'inset 0 0 0 2px #D9B36A' }] },
      'p3-rows-a': { frame: false, tl: false, rows: [0, 1, 2, 3].map(i => ({ g: ['photo_library', 'photo_camera', 'mic', 'notifications'][i], op: i < 2 ? 1 : 0.3, y: i < 2 ? '0' : '6px', bg: 'rgba(120,120,128,.4)', ring: 'none' })) },
      'p3-rows': { frame: false, tl: false, rows: [0, 1, 2, 3].map(i => ({ g: ['photo_library', 'photo_camera', 'mic', 'notifications'][i], op: 1, y: '0', bg: i === 1 ? 'rgba(217,179,106,.5)' : 'rgba(120,120,128,.4)', ring: i === 1 ? '0 0 0 1.5px #D9B36A' : 'none' })) },
      'p3-changed': { frame: false, tl: false, rows: [0, 1, 2, 3].map(i => ({ g: ['photo_library', 'photo_camera', 'mic', 'notifications'][i], op: 1, y: '0', bg: i === 1 ? '#34C759' : 'rgba(120,120,128,.4)', ring: 'none' })) },
      'p4-thumb': { frame: false, tl: false, thumb: true },
      'p4-arc': { frame: false, tl: false, thumb: true, marks: 'arc' },
      'p4-busy': { frame: false, tl: false, thumb: true, marks: 'arc', spin: true },
      'p4-done': { frame: false, tl: false, tick: true }
    };
    Object.assign(a, P[k] || P['p1-final']);
    if (a.marks === 'arc') a.marks = [['6%', '42%'], ['20%', '12%'], ['43%', '2%'], ['66%', '12%'], ['80%', '42%']].map(([x, y], i) => ({ x, y, t: ['YT', 'TT', 'IG', 'FB', 'X'][i], op: 1 }));
    if (!a.frame && a.tl && !a.clips.length) a.tl = false;
    if (!a.tl) a.frameH = '84%';
    return { a };
  }
}
</script>
</body>
</html>
